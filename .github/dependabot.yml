version: 2
# One grouped PR per ecosystem each Monday instead of one per dependency.
# Cooldown skips releases younger than 5 days (a yanked or hijacked release usually surfaces by then).
# Dependabot doesn't move Go itself to a patched release (go get only raises the go line when a
# dependency needs it), so stdlib fixes are a hand bump of go.mod's toolchain plus the golang tag in
# .github/Dockerfile (CI fails if they differ), flagged by govulncheck in ci.yml.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      # anacrolix has needed workarounds before; a breaking release shouldn't hold up the rest
      anacrolix:
        patterns: ["github.com/anacrolix/*"]
      go:
        patterns: ["*"]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # e2e/ is dev-only (Playwright for CI); the web UI is vendored and has no package.json
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      e2e:
        patterns: ["*"]
    commit-message:
      prefix: e2e
