name: Search providers
on:
  # sites change their markup or put up Cloudflare without notice
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - server/search-config.json
      - server/search_live_test.go
      - .github/workflows/search-providers.yml
permissions:
  contents: read
jobs:
  live:
    name: Live search check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -tags live ./server
      - name: Search every provider
        run: go test -tags live -run TestLiveSearchProviders -v ./server
