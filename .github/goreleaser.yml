# test this file with
#   goreleaser build --snapshot --config .github/goreleaser.yml
version: 2
builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
      # no openbsd: anacrolix/torrent's storage package uses unix.SEEK_DATA,
      # which golang.org/x/sys doesn't define there, so it doesn't compile
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
    goarm:
      - '6'
      - '7'
nfpms:
  - maintainer: "https://github.com/{{ .Env.GITHUB_USER }}"
    description: Self-hosted remote torrent client with a web UI, forked from jpillora/cloud-torrent
    homepage: "https://github.com/{{ .Env.GITHUB_USER }}/cloud-fetch"
    license: AGPL-3.0
    formats:
      - deb
      - rpm
      - apk
archives:
  - formats: [gz]
    files:
      - none*
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
